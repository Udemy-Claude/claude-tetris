<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tetris</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="wrapper">
    <div class="game-container">
        <canvas id="board" width="300" height="600"></canvas>

        <aside class="panel">
            <div class="panel-section">
                <span class="label">SCORE</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="panel-section">
                <span class="label">LINES</span>
                <span class="value" id="lines">0</span>
            </div>
            <div class="panel-section">
                <span class="label">LEVEL</span>
                <span class="value" id="level">1</span>
            </div>

            <div class="panel-section">
                <span class="label">NEXT</span>
                <canvas id="next-canvas" width="120" height="120"></canvas>
            </div>

            <div class="panel-section">
                <span class="label">SKIN</span>
                <select id="skin-select">
                    <option value="retro">Retro</option>
                    <option value="neon">Neon</option>
                    <option value="pastel">Pastel</option>
                    <option value="pixel">Pixel Art</option>
                </select>
            </div>

            <div class="panel-section">
                <span class="label">RECORDS</span>
                <div id="hs-list-panel"></div>
                <button id="hs-reset-btn" class="small-btn">Reset</button>
            </div>

            <div class="panel-section controls">
                <span class="label">CONTROLS</span>
                <ul>
                    <li><kbd>←</kbd><kbd>→</kbd> mover</li>
                    <li><kbd>↑</kbd> rotar</li>
                    <li><kbd>↓</kbd> bajar</li>
                    <li><kbd>Space</kbd> caída</li>
                    <li><kbd>P</kbd> pausa</li>
                </ul>
            </div>
        </aside>
    </div>

    <div id="overlay" class="overlay">
        <!-- START SCREEN -->
        <div id="scr-start">
            <p id="start-title">TETRIS</p>
            <button id="start-btn" class="menu-btn">JUGAR</button>
            <div id="start-hs"></div>
        </div>

        <!-- GAME OVER / PAUSE SCREEN -->
        <div id="scr-gameover" class="overlay-box hidden">
            <p id="overlay-title">GAME OVER</p>
            <p id="overlay-score" class="go-only"></p>
            <p id="go-score" class="go-only"></p>
            <p id="go-bests" class="go-only"></p>
            <div id="name-row" class="go-only hidden">
                <input id="name-input" maxlength="8" placeholder="Tu nombre">
                <button id="save-btn">Guardar</button>
            </div>
            <div id="go-hs" class="go-only"></div>
            <button id="go-hs-reset" class="menu-btn small-btn go-only">Reset records</button>
            <button id="restart-btn" class="menu-btn">Reiniciar</button>
        </div>
    </div>
</div>

<script src="js/game.js"></script>
</body>
</html>
