<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">TETRIS</p>
        <p id="overlay-score"></p>

        <!-- High score name input -->
        <div id="hs-input-area" class="hs-hidden">
          <input type="text" id="hs-name-input" maxlength="10" placeholder="Tu nombre" autocomplete="off" />
          <button id="hs-save-btn">Guardar</button>
        </div>

        <!-- Scores table -->
        <div class="hs-section">
          <div class="hs-title">MEJORES PUNTUACIONES</div>
          <ol id="hs-list"></ol>
          <div class="hs-stats">
            <span>Mejor combo: <b id="hs-max-combo">0</b></span>
            <span>Max lineas: <b id="hs-max-lines">0</b></span>
          </div>
          <button id="hs-reset-btn">Resetear records</button>
        </div>

        <button id="restart-btn">Comenzar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
